name: scrapbid

services:
  db:
    image: postgis/postgis:16-3.6@sha256:d07ce3f06f657b6516c7511412232e97174d7e9dcf4c9fe520109b682b44a201
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: on first start the image runs a temporary socket-only server while
      # it initialises, and a socket check would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO's own images are no longer published; this is MinIO built by Chainguard.
  minio:
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  # Creates the private bucket, then exits. Retries until MinIO is up.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:7e80e77f8c949810d0eaead1120e28c63f913ff96ae7f78a8e4cd3c1e2f0623f
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET}"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      - minio
    restart: on-failure

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # Runs scheduled management commands (see backend/scheduler.py).
  # Restart it after changing job code: docker compose restart scheduler
  scheduler:
    build: ./backend
    command: ["python", "scheduler.py"]
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Dependencies stay in a Docker volume, never on the host.
      - frontend-node-modules:/app/node_modules

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    environment:
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - minio

volumes:
  db-data:
  minio-data:
  frontend-node-modules:
